name: Speisekarte aktualisieren

# Holt die aktuelle Speisekarte (Preise, neue Gerichte, Optionen) von der
# Smoothr-Schnittstelle und committet sie, wenn sich etwas geändert hat.
#
# Wichtig: Ein Commit, den eine Action mit dem eingebauten Token macht, löst
# absichtlich KEINE weiteren Abläufe aus. Die Veröffentlichung würde also nie
# starten. Deshalb wird sie hier zum Schluss ausdrücklich angestoßen.

on:
  schedule:
    # täglich um 04:17 UTC (ungerade Minute, damit nicht zur Volllaststunde)
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: menu-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Speisekarte abrufen
        run: node scripts/snapshot.js

      - name: Bei Änderungen committen
        id: commit
        run: |
          if [ -z "$(git status --porcelain renderer/menu-seed.json)" ]; then
            echo "Keine Änderungen an der Speisekarte."
            echo "geaendert=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add renderer/menu-seed.json
          git commit -m "Speisekarte automatisch aktualisiert"
          git push
          echo "geaendert=true" >> "$GITHUB_OUTPUT"

      - name: Veröffentlichung anstoßen
        if: steps.commit.outputs.geaendert == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Deploy to GitHub Pages" \
            --repo "$GITHUB_REPOSITORY" --ref main
          echo "Veröffentlichung angestoßen."
