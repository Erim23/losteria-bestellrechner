name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # GitHub Pages liefert mit max-age=600 aus. Ohne Versionsangabe sehen
      # Besucher nach einer Änderung bis zu 10 Minuten die alte Fassung.
      - name: Dateiverweise versionieren
        run: node scripts/cachebust.js "${GITHUB_SHA:0:8}"

      - name: Upload renderer as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: renderer

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
